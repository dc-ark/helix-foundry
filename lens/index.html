<title>Ark Ledger Lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
/* Layout: a fixed left sidebar (sections, sub-sections, recent questions) beside one
   scrolling content column; warm paper surfaces, serif display headings, green accent. */
:root {
  --bg: #f6f5f1; --surface: #fbfaf7; --raised: #ffffff; --sunken: #efede6; --fg: #23251f; --muted: #6b6c63; --faint: #9a9a90; --line: #e6e3da; --line-strong: #d6d2c6;
  --accent: #2f7d5b; --accent-ink: #ffffff; --accent-soft: #e5efe8; --accent-fill: rgb(47 125 91 / 0.10); --ink-btn: #23251f;
  --warn: #8a6100; --warn-bg: #f7f0de; --warn-line: #e9d9ae; --bad: #b23a2a; --good: #2f7d5b;
  --t-party: #eb6834; --t-fee: #2a78d6; --t-pay: #1baf7a; --t-txn: #eda100; --t-owner: #e87ba4; --t-sender: #6250d6; --t-acct: #008300; --t-other: #9a9a90;
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161714; --surface: #1c1d1a; --raised: #22231f; --sunken: #262722; --fg: #ecebe4; --muted: #a3a397; --faint: #75766c; --line: #2e2f2a; --line-strong: #3b3c36;
  --accent: #6cc39a; --accent-ink: #12130f; --accent-soft: #1f3128; --accent-fill: rgb(108 195 154 / 0.14); --ink-btn: #ecebe4;
  --warn: #e9c46a; --warn-bg: #2c2615; --warn-line: #4a3f1f; --bad: #ff8a7a; --good: #6cc39a;
  --t-party: #d95926; --t-fee: #3987e5; --t-pay: #199e70; --t-txn: #c98500; --t-owner: #d55181; --t-sender: #9085e9; --t-acct: #2f9e2f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161714; --surface: #1c1d1a; --raised: #22231f; --sunken: #262722; --fg: #ecebe4; --muted: #a3a397; --faint: #75766c; --line: #2e2f2a; --line-strong: #3b3c36;
  --accent: #6cc39a; --accent-ink: #12130f; --accent-soft: #1f3128; --accent-fill: rgb(108 195 154 / 0.14); --ink-btn: #ecebe4;
  --warn: #e9c46a; --warn-bg: #2c2615; --warn-line: #4a3f1f; --bad: #ff8a7a; --good: #6cc39a;
  --t-party: #d95926; --t-fee: #3987e5; --t-pay: #199e70; --t-txn: #c98500; --t-owner: #d55181; --t-sender: #9085e9; --t-acct: #2f9e2f; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14.5px; line-height: 1.5; }
.mono, code { font-family: var(--mono); } .num { font-variant-numeric: tabular-nums; }
code { font-size: 0.9em; background: var(--sunken); padding: 1px 5px; border-radius: 4px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.link { color: var(--accent); cursor: pointer; background: none; border: 0; padding: 0; }
.link:hover { text-decoration: underline; }

/* Shell */
.app { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; box-sizing: border-box; border-right: 1px solid var(--line); background: var(--bg); padding: 18px 12px; display: flex; flex-direction: column; gap: 14px; }
.wordmark { font-weight: 600; font-size: 19px; letter-spacing: -0.03em; padding: 2px 10px; }
.wordmark b { font-weight: 700; }
.ws { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--raised); border-radius: 10px; padding: 8px 10px; }
.ws .badge { width: 30px; height: 30px; border-radius: 7px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 12.5px; }
.ws .t { font-weight: 600; font-size: 14px; } .ws .s { font-size: 12px; color: var(--muted); }
.nav { display: grid; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 8px; color: var(--fg); background: none; border: 0; text-align: left; font-size: 14.5px; width: 100%; }
.nav-item svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
.nav-item:hover { background: var(--sunken); }
.nav-item[aria-current="page"] { background: var(--accent-soft); font-weight: 500; }
.nav-item[aria-current="page"] svg { color: var(--accent); }
.nav-item:disabled { opacity: 0.45; cursor: default; }
.nav-sub { margin: 2px 0 4px 19px; border-left: 1px solid var(--line); display: grid; gap: 1px; padding-left: 10px; }
.nav-sub button { background: none; border: 0; text-align: left; padding: 6px 10px; border-radius: 7px; color: var(--muted); font-size: 13.5px; position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-sub button:hover { color: var(--fg); background: var(--sunken); }
.nav-sub button[aria-current="page"] { color: var(--fg); font-weight: 500; }
.nav-sub button[aria-current="page"]::before { content: ""; position: absolute; left: -11px; top: 6px; bottom: 6px; width: 2px; background: var(--accent); border-radius: 2px; }
.nav-row { display: flex; align-items: center; } .nav-row .nav-item { flex: 1; }
.icon-btn { background: none; border: 0; padding: 6px; border-radius: 6px; color: var(--muted); display: grid; place-items: center; }
.icon-btn:hover { background: var(--sunken); color: var(--fg); }
.icon-btn svg { width: 16px; height: 16px; }
.side-foot { margin-top: auto; border-top: 1px solid var(--line); padding: 12px 6px 0; display: flex; gap: 10px; align-items: center; }
.side-foot .av { width: 34px; height: 34px; border-radius: 50%; background: var(--ink-btn); color: var(--bg); display: grid; place-items: center; flex: none; }
.side-foot .av svg { width: 16px; height: 16px; }
.side-foot .t { font-weight: 500; font-size: 13.5px; } .side-foot .s { font-size: 12px; color: var(--muted); }
main { padding: 28px 32px 64px; display: grid; gap: 22px; align-content: start; max-width: 1240px; width: 100%; box-sizing: border-box; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--line); gap: 8px; }
  .ws, .side-foot, .nav-sub { display: none; }
  .nav { display: flex; flex-wrap: wrap; gap: 2px; } .nav-item { width: auto; padding: 6px 10px; } .nav-row .icon-btn { display: none; }
  main { padding: 20px 16px 48px; }
}

/* Type */
h1, .display { font-family: var(--serif); font-weight: 400; letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
h1 { font-size: 40px; line-height: 1.1; }
h2 { font-size: 15px; font-weight: 600; margin: 0; }
.lede { color: var(--muted); margin: 6px 0 0; font-size: 15.5px; max-width: 70ch; }
.muted { color: var(--muted); } .small { font-size: 12.5px; }
.eyebrow { font-size: 13px; color: var(--muted); }

/* Surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.card.pad { padding: 18px; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.card-head .sub, .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.split { border-top: 1px solid var(--line); }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 13px; color: var(--fg); white-space: nowrap; }
button.pill:hover { border-color: var(--accent); }
.pill svg { width: 14px; height: 14px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: inline-block; flex: none; }
.btn { border: 1px solid var(--line-strong); background: var(--raised); border-radius: 9px; padding: 8px 14px; font-weight: 500; display: inline-flex; gap: 8px; align-items: center; }
.btn:hover { border-color: var(--faint); }
.btn.dark { background: var(--ink-btn); color: var(--bg); border-color: var(--ink-btn); }
.btn.plain { border-color: transparent; background: none; }
.btn svg { width: 15px; height: 15px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.seg { display: inline-flex; background: var(--sunken); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 8px; color: var(--muted); font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }
input[type="search"], input[type="text"], textarea, select { font: inherit; color: var(--fg); background: var(--raised); border: 1px solid var(--line-strong); border-radius: 10px; padding: 9px 12px; min-width: 0; box-sizing: border-box; }
.search { position: relative; } .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
.search input { padding-left: 36px; width: 100%; }
.empty { color: var(--muted); font-size: 13.5px; padding: 6px 0; }

/* Home */
.hero { position: relative; overflow: hidden; padding: 30px 32px 28px; border-radius: 16px; border: 1px solid var(--line);
  background: radial-gradient(120% 140% at 100% 0%, var(--accent-soft) 0%, transparent 45%), var(--surface); }
.hero::after { content: ""; position: absolute; inset: 0 0 0 55%; pointer-events: none; opacity: 0.55;
  background-image: radial-gradient(var(--line-strong) 1px, transparent 1.3px); background-size: 14px 14px;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 60%); mask-image: linear-gradient(90deg, transparent, #000 60%); }
.hero > * { position: relative; z-index: 1; }
.hero h1 { margin-top: 6px; }
.hero .meta { margin-top: 8px; color: var(--muted); } .hero .meta b { color: var(--fg); font-weight: 500; }
.askbox { margin-top: 22px; max-width: 760px; display: flex; align-items: center; gap: 10px; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 12px; padding: 6px 6px 6px 14px; box-shadow: 0 1px 3px rgb(0 0 0 / 0.04); }
.askbox svg.spark { width: 18px; height: 18px; color: var(--accent); flex: none; }
.askbox input { border: 0; background: none; padding: 9px 0; flex: 1; font-size: 15.5px; outline: none; }
.askbox .send { width: 36px; height: 36px; border-radius: 8px; border: 0; background: var(--sunken); color: var(--muted); display: grid; place-items: center; flex: none; }
.askbox .send svg { width: 16px; height: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; max-width: 760px; }
.section-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.metric { padding: 18px; display: grid; gap: 4px; align-content: start; }
.metric .label { font-size: 13.5px; color: var(--muted); }
.metric .value { font-size: 30px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
.metric .delta { font-size: 13px; } .metric .delta.up { color: var(--good); } .metric .delta.down { color: var(--bad); }
.metric .foot { font-size: 13px; color: var(--muted); }
.statline { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; } .statline .big { font-size: 30px; font-weight: 500; font-variant-numeric: tabular-nums; } .statline .unit { color: var(--muted); font-size: 15px; }
.attention { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 12px; padding: 14px 18px; display: grid; gap: 10px; }
.attention .title { color: var(--warn); font-weight: 500; display: flex; gap: 8px; align-items: center; }
.attention .title svg { width: 17px; height: 17px; }
.attention .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.continue { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.continue .lbl { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13.5px; margin-right: 4px; }
.continue .lbl svg { width: 15px; height: 15px; }
.onto-card .body { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; padding: 16px 18px 20px; }
@media (max-width: 760px) { .onto-card .body { grid-template-columns: 1fr; } }
.typebars { display: grid; gap: 14px; align-content: start; }
.typebar .top { display: flex; justify-content: space-between; font-size: 13.5px; } .typebar .top span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.typebar .track, .barrow .track { height: 4px; background: var(--sunken); border-radius: 2px; margin-top: 6px; }
.typebar .fill, .barrow .fill { height: 100%; background: var(--accent); border-radius: 2px; min-width: 4px; }

/* Charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text { fill: var(--faint); font-size: 11px; font-family: var(--sans); }
.gridl line { stroke: var(--line); }
.tip { position: absolute; pointer-events: none; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 6px 20px rgb(0 0 0 / 0.10); min-width: 140px; z-index: 3; }
.tip .t { color: var(--muted); margin-bottom: 2px; } .tip .r { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
.barlist { display: grid; gap: 12px; }
.barrow .top { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; }
.barrow .top .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barrow .top .val { color: var(--muted); font-variant-numeric: tabular-nums; }
.barrow.click { cursor: pointer; } .barrow.click:hover .name { color: var(--accent); }

/* Tables */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { padding-left: 0; } th:last-child, td:last-child { padding-right: 0; }
th { color: var(--muted); font-weight: 500; font-size: 12.5px; background: var(--surface); position: sticky; top: 0; }
th.sortable { cursor: pointer; } th.sortable:hover { color: var(--fg); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--sunken); }
.grid-scroll { max-height: 64vh; overflow: auto; }
.datagrid { display: grid; gap: 16px; grid-template-columns: minmax(0, 250px) minmax(0, 1fr); align-items: start; }
@media (max-width: 900px) { .datagrid { grid-template-columns: 1fr; } }

/* Explorer */
.typechips { display: flex; flex-wrap: wrap; gap: 8px; }
.typechips button { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--raised); border-radius: 999px; padding: 6px 13px; font-size: 13.5px; }
.typechips button[aria-pressed="false"] { opacity: 0.45; }
.typechips button .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.graph-wrap { position: relative; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; height: min(72vh, 760px); min-height: 420px; }
#gsvg { width: 100%; height: 100%; display: block; cursor: grab; }
#gsvg:active { cursor: grabbing; }
.graph-wrap .lbl { fill: var(--fg); paint-order: stroke; stroke: var(--surface); pointer-events: none; }
.zoom { position: absolute; left: 16px; bottom: 16px; display: grid; gap: 8px; }
.zoom button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raised); display: grid; place-items: center; }
.zoom svg { width: 16px; height: 16px; }
.inspector { position: absolute; top: 16px; right: 16px; bottom: 16px; width: min(380px, calc(100% - 32px)); background: var(--raised); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px rgb(0 0 0 / 0.10); padding: 18px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; box-sizing: border-box; }
.inspector .name { font-family: var(--serif); font-size: 21px; line-height: 1.2; display: flex; gap: 10px; align-items: baseline; padding-right: 30px; }
.inspector .name .dot { transform: translateY(-2px); }
.inspector .rel { overflow-y: auto; display: grid; align-content: start; }
.inspector .rel button { display: flex; justify-content: space-between; gap: 10px; align-items: center; background: none; border: 0; padding: 8px 4px; border-radius: 6px; text-align: left; }
.inspector .rel button:hover { background: var(--sunken); }
.inspector .rel .nm { display: flex; gap: 10px; align-items: center; overflow: hidden; } .inspector .rel .nm span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inspector .rel .ty { color: var(--muted); font-size: 12.5px; flex: none; }
.x-btn { position: absolute; top: 14px; right: 14px; }
.drawer-back { position: fixed; inset: 0; background: rgb(30 30 25 / 0.28); backdrop-filter: blur(3px); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--raised); z-index: 21; box-shadow: -10px 0 40px rgb(0 0 0 / 0.15); display: flex; flex-direction: column; border-radius: 14px 0 0 14px; }
.drawer header { padding: 22px 26px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.drawer header .display { font-size: 26px; line-height: 1.2; word-break: break-word; }
.drawer .body { overflow-y: auto; padding: 18px 26px 32px; display: grid; gap: 18px; align-content: start; }
.kv { display: grid; grid-template-columns: minmax(110px, 0.8fr) minmax(0, 1.2fr); }
.kv > div { padding: 11px 0; border-bottom: 1px solid var(--line); min-width: 0; word-break: break-word; }
.kv .k { color: var(--muted); padding-right: 12px; }
.related button { display: flex; justify-content: space-between; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 0; text-align: left; font-weight: 500; }
.related button:hover { color: var(--accent); }
.related .ty { color: var(--muted); font-weight: 400; font-size: 13px; }

/* Object types canvas */
.canvas { position: relative; border: 1px solid var(--line); border-radius: 16px; padding: 40px 36px; background-color: var(--surface); background-image: radial-gradient(var(--line-strong) 1px, transparent 1.3px); background-size: 22px 22px; overflow-x: auto; }
.canvas .rows { display: grid; gap: 84px; position: relative; z-index: 1; min-width: 860px; }
.canvas .row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px; }
.tcard { min-width: 0; background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 1px 2px rgb(0 0 0 / 0.04); cursor: pointer; box-sizing: border-box; }
.tcard:hover { border-color: var(--faint); }
.tcard.activity { border-style: dashed; background: var(--surface); }
.tcard .tt { font-size: 18px; font-weight: 500; } .tcard .meta { font-size: 13px; color: var(--muted); }
.tcard .meta code { font-size: 12px; }
.tcard .desc { font-size: 14px; opacity: 0.85; }
.tcard .tag { align-self: flex-start; font-size: 12.5px; border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px 10px; color: var(--muted); }
.tcard .src { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 8px; font-size: 13.5px; }
.tcard .src { gap: 10px; } .tcard .src span:first-child { display: flex; gap: 8px; align-items: center; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; } .tcard .src span:last-child { color: var(--muted); font-size: 12.5px; flex: none; }
.tcard .src svg { width: 15px; height: 15px; color: var(--muted); }
.canvas svg.links { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 0; overflow: visible; }
.canvas svg.links path { fill: none; stroke: var(--faint); stroke-width: 1.4; }
.canvas .elabel { position: absolute; z-index: 2; transform: translate(-50%, -50%); background: var(--raised); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.canvas-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.canvas-foot .legend { display: flex; gap: 16px; }
.canvas-foot .legend span::before { content: ""; display: inline-block; width: 22px; border-top: 1.5px solid var(--faint); margin-right: 6px; vertical-align: middle; }
.canvas-foot .legend span.dash::before { border-top-style: dashed; }

/* Analyst */
.ask { display: grid; gap: 18px; max-width: 880px; }
.thread { display: grid; gap: 22px; }
.msg-user { justify-self: end; background: var(--accent-soft); padding: 10px 15px; border-radius: 14px 14px 4px 14px; max-width: 75ch; white-space: pre-wrap; }
.msg-bot { display: grid; gap: 10px; }
.answer p { margin: 0 0 8px; } .answer ul { margin: 0 0 8px; padding-left: 20px; }
.answer pre { background: var(--sunken); padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12.5px; }

<script>
"use strict";
// ---------- Engine: DuckDB-WASM inside the artifact sandbox ----------
// The sandbox only lets scripts come from the CDN, so the engine and its
// Parquet extension are published beside this page and served from here.
const DUCK_VER = "1.32.0", DUCK_CORE = "v1.4.3";
const CDN = `https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@${DUCK_VER}`;
const WASM_URL = new URL("duckdb-eh.gz.wasm", location.href).href;
const EXT_REPO = new URL("ext", location.href).href;

const state = {
  view: "loader", db: null, conn: null, sample: null, tables: new Map(), manifest: null,
  home: { range: 90 }, party: null,
  explorer: { mode: "graph", hidden: new Set(), selected: null, q: "" },
  ask: { threads: [], current: null, busy: false, ctl: null },
  grid: { table: null, filter: "", sort: null, desc: false, page: 0 },
  recent: [],
};
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const qid = (s) => '"' + String(s).replaceAll('"', '""') + '"';
const lit = (s) => "'" + String(s).replaceAll("'", "''") + "'";
const has = (t) => state.tables.has(t);
const hasCol = (t, c) => has(t) && state.tables.get(t).cols.some((x) => x.name === c);

function workerSource() {
  return `const WASM=${JSON.stringify(WASM_URL)};const realFetch=self.fetch.bind(self);
self.fetch=async(input,init)=>{const url=typeof input==="string"?input:input.url;if(url!==WASM)return realFetch(input,init);
const buf=await(await realFetch(WASM)).arrayBuffer();const h=new Uint8Array(buf,0,2);const gz=h[0]===0x1f&&h[1]===0x8b;
const body=gz?new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip")):buf;
return new Response(body,{headers:{"content-type":"application/wasm"}});};
importScripts(${JSON.stringify(CDN + "/dist/duckdb-browser-eh.worker.js")});`;
}
async function startEngine() {
  const duckdb = await import(CDN + "/+esm");
  const worker = new Worker(URL.createObjectURL(new Blob([workerSource()], { type: "text/javascript" })));
  const db = new duckdb.AsyncDuckDB(new duckdb.VoidLogger(), worker);
  await db.instantiate(WASM_URL);
  // Sums of BIGINT come back as HUGEINT and prices as DECIMAL, which Arrow hands to
  // JavaScript as raw words; doubles are what the page formats.
  await db.open({ query: { castBigIntToDouble: true, castDecimalToDouble: true } });
  const conn = await db.connect();
  await conn.query(`SET custom_extension_repository = ${lit(EXT_REPO)}`);
  await conn.query("LOAD parquet");
  state.db = db; state.conn = conn;
}
const plain = (v) => typeof v === "bigint" ? (Number.isSafeInteger(Number(v)) ? Number(v) : v.toString())
  : v instanceof Date ? v.toISOString() : (v && typeof v === "object" && typeof v.toJSON === "function") ? v.toJSON() : v;
async function q(sql) {
  const res = await state.conn.query(sql);
  // Arrow reports DATE and TIMESTAMP as epoch milliseconds; turn them back into readable ISO text.
  const kind = Object.fromEntries(res.schema.fields.map((f) => [f.name, /^Date/.test(String(f.type)) ? "date" : /^Timestamp/.test(String(f.type)) ? "ts" : ""]));
  const val = (k, v) => typeof v === "number" && kind[k] ? (kind[k] === "date" ? new Date(v).toISOString().slice(0, 10) : new Date(v).toISOString().replace("T", " ").slice(0, 19)) : plain(v);
  return res.toArray().map((r) => Object.fromEntries(Object.entries(r.toJSON()).map(([k, v]) => [k, val(k, v)])));
}
const one = async (sql) => (await q(sql))[0] || {};
// Client accounts are credit-normal: the ledger stores money held for a client as a
// negative balance. Shown to people, it is flipped so "held for them" reads positive.
const held = (addr, v) => (String(addr || "").startsWith("clients:") ? -1 : 1) * (Number(v) || 0);

// ---------- Formatting ----------
const nf = new Intl.NumberFormat("en-US");
function money(v, { compact = true } = {}) {
  const n = Number(v); if (!Number.isFinite(n)) return "–";
  if (!compact || Math.abs(n) < 10000) return (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString("en-US", { maximumFractionDigits: 2, minimumFractionDigits: Math.abs(n) < 100 && n % 1 ? 2 : 0 });
  return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", notation: "compact", maximumFractionDigits: 1 }).format(n);
}
const count = (v) => Number.isFinite(Number(v)) ? nf.format(Number(v)) : "–";
const compactN = (v) => new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 1 }).format(v);
function cell(v) {
  if (v === null || v === undefined) return '<span style="color:var(--faint)">—</span>';
  if (typeof v === "number") return Number.isInteger(v) ? nf.format(v) : v.toLocaleString("en-US", { maximumFractionDigits: 4 });
  if (typeof v === "object") return esc(JSON.stringify(v));
  return esc(v);
}
const titleCase = (s) => String(s).replace(/_/g, " ").replace(/^\w/, (c) => c.toUpperCase());
const plural = (w, n = 2) => n === 1 ? w : /[^aeiou]y$/.test(w) ? w.slice(0, -1) + "ies" : w + "s";
const day = (d) => new Date(d + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });

const ICON = {
  home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  onto: '<path d="M12 3l3.5 6h-7z"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><circle cx="17.5" cy="17.5" r="3.5"/>',
  data: '<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
  spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  up: '<path d="M12 19V5M5 12l7-7 7 7"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', minus: '<path d="M5 12h14"/>', fit: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>', arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>', clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
  file: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>', alert: '<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/>',
  db: '<ellipse cx="12" cy="6" rx="7" ry="2.5"/><path d="M5 6v12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V6"/>',
  shape: '<path d="M12 3l3.5 6h-7z"/><circle cx="17" cy="17" r="3"/><rect x="4" y="14" width="6" height="6" rx="1"/>',
  chat: '<path d="M4 5h16v11H9l-5 4z"/>',
};
const icon = (n, cls = "") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

// ---------- Object types: what each exported dataset is ----------
// One row per dataset: display name, its key, the color it wears, and its
// ontology role (hub record, related record, or activity stream).
const TYPES = {
  parties: { name: "Party", key: "party_id", color: "--t-party", role: "hub", label: "party_name" },
  transactions: { name: "Transaction", key: "txn_id", color: "--t-txn", role: "hub", label: "transaction_type" },
  accounts: { name: "Account", key: "account_address", color: "--t-acct", role: "record", label: "account_address" },
  postings: { name: "Posting", key: "posting_id", color: "--t-other", role: "activity" },
  daily_volume: { name: "Daily volume", key: null, color: "--t-other", role: "activity" },
  revenue: { name: "Revenue", key: null, color: "--t-other", role: "activity" },
  fees: { name: "Fee", key: "fee_id", color: "--t-fee", role: "record", label: "fee_id" },
  payment_corridors: { name: "Payment corridor", key: null, color: "--t-other", role: "activity" },
  payments_in_flight: { name: "Payment in flight", key: "payment_id", color: "--t-pay", role: "record", label: "payment_id" },
  reserve_positions: { name: "Reserve position", key: "lot_id", color: "--t-other", role: "record", label: "instrument_id" },
  senders: { name: "Sender", key: "sender_id", color: "--t-sender", role: "record", label: "sender_name" },
  beneficial_owners: { name: "Beneficial owner", key: "owner_id", color: "--t-owner", role: "record", label: "owner_name" },
  ownership_links: { name: "Ownership link", key: null, color: "--t-other", role: "record" },
  ownership_nodes: { name: "Ownership node", key: "owner_node_id", color: "--t-other", role: "record", label: "legal_name" },
};
const typeOf = (t) => TYPES[t] || { name: titleCase(t), key: null, color: "--t-other", role: "record" };
const typeColor = (t) => `var(${typeOf(t).color})`;
// A dataset references a hub (parties, transactions) when it carries the hub's key
// column; ownership links also reference ownership nodes.
function references() {
  const targets = [["parties", "party_id"], ["transactions", "txn_id"], ["ownership_nodes", "owner_node_id"]];
  const out = [];
  for (const [t] of state.tables) for (const [u, col] of targets)
    if (u !== t && has(u) && hasCol(t, col) && !(u === "ownership_nodes" && t !== "ownership_links"))
      out.push({ from: t, to: u, dashed: typeOf(t).role === "activity" });
  return out;
}

// ---------- Loading files ----------
const EXPECTED = Object.keys(TYPES);
async function loadFiles(list, status) {
  const files = [...(list || [])];
  if (!files.length) return status("No files came through. Try dragging them onto the box instead.");
  for (const f of files) {
    try {
      if (/manifest\.json$/i.test(f.name)) { state.manifest = JSON.parse(await f.text()); continue; }
      if (!/\.parquet$/i.test(f.name)) { status(`Skipped ${f.name}: not a Parquet file.`); continue; }
      const name = f.name.replace(/\.parquet$/i, "").replace(/[^A-Za-z0-9_]/g, "_");
      status(`Loading ${f.name} (${(f.size / 1e6).toFixed(1)} MB)...`);
      await state.db.registerFileBuffer(f.name, new Uint8Array(await f.arrayBuffer()));
      // Materialised once so every later query reads from memory, not the Parquet bytes.
      await state.conn.query(`CREATE OR REPLACE TABLE ${qid(name)} AS SELECT * FROM read_parquet(${lit(f.name)})`);
      const cols = await q(`SELECT column_name AS name, data_type AS type FROM information_schema.columns WHERE table_name = ${lit(name)} ORDER BY ordinal_position`);
      const rows = (await one(`SELECT count(*) AS n FROM ${qid(name)}`)).n;
      state.tables.set(name, { rows, cols });
    } catch (e) { return status(`Could not load ${f.name}: ${e.message || e}`); }
  }
  status("");
  if (state.tables.size) { graphCache = null; go(location.hash.slice(1) || "home"); }
}

function renderLoader(msg = "") {
  state.view = "loader"; renderNav();
  $("#main").innerHTML = `
  <div class="loader">
    <div><div class="eyebrow">Ark dev ledger</div><h1>Load your export to begin</h1>
      <p class="lede">Choose every file in <code>ark/out/</code>. They're read here in your browser and never uploaded; only the results of questions you ask go to Claude.</p></div>
    <div class="drop" id="drop">
      <div style="font-size:16px;font-weight:500">Drop the Parquet files here</div>
      <div class="muted">or</div>
      <label class="btn dark filebtn">Choose files<input type="file" id="pick" multiple accept=".parquet,.json"></label>
      <div class="muted small" id="loadstatus" aria-live="polite">${esc(msg)}</div>
    </div>
    <div class="card pad" style="display:grid;gap:10px">
      <h2>What the export contains</h2>
      <div class="expect">${EXPECTED.map((t) => `<span class="pill"><span class="dot" style="--c:${typeColor(t)}"></span>${t}</span>`).join("")}</div>
      <p class="muted small" style="margin:0">Any subset works; views that need a missing file say so. Include <code>manifest.json</code> to show when the export was taken.</p>
    </div>
  </div>`;
  const status = (s) => { const el = $("#loadstatus"); if (el) el.textContent = s; };
  if (!msg) status(state.conn ? "Ready. Choose or drop your files." : engineError || "Starting the query engine...");
  $("#pick").addEventListener("change", (e) => { if (state.conn) loadFiles(e.target.files, status); e.target.value = ""; });
  const drop = $("#drop");
  for (const ev of ["dragenter", "dragover"]) drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); });
  for (const ev of ["dragleave", "drop"]) drop.addEventListener(ev, () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); if (state.conn) loadFiles(e.dataTransfer.files, status); });
}

// ---------- Navigation ----------
const VIEWS = { home: renderHome, explorer: renderExplorer, types: renderTypes, data: renderData, analyst: renderAnalyst, party: renderPartyPage };
function renderNav() {
  const v = state.view, on = state.tables.size > 0, dis = on ? "" : "disabled";
  const cur = (yes) => (yes ? 'aria-current="page"' : "");
  $("#nav").innerHTML = `
    <button class="nav-item" data-go="home" ${cur(v === "home")} ${dis}>${icon("home")}<span>Home</span></button>
    <button class="nav-item" data-go="explorer" ${cur(["explorer", "types", "party"].includes(v))} ${dis}>${icon("onto")}<span>Ontology</span></button>
    <div class="nav-sub"><button data-go="explorer" ${cur(v === "explorer" || v === "party")} ${dis}>Explorer</button><button data-go="types" ${cur(v === "types")} ${dis}>Object types</button></div>
    <button class="nav-item" data-go="data" ${cur(v === "data")} ${dis}>${icon("data")}<span>Data</span></button>
    <div class="nav-row"><button class="nav-item" data-go="analyst" ${cur(v === "analyst")} ${dis}>${icon("spark")}<span>Analyst</span></button><button class="icon-btn" data-new-thread title="New question" aria-label="New question" ${dis}>${icon("edit")}</button></div>
    <div class="nav-sub">${state.ask.threads.slice(-6).reverse().map((t) => `<button data-thread="${t.id}" ${cur(v === "analyst" && state.ask.current === t.id)} title="${esc(t.title)}">${esc(t.title)}</button>`).join("")}</div>`;
  const rows = [...state.tables.values()].reduce((a, t) => a + t.rows, 0);
  $("#ws-sub").textContent = on ? `${state.tables.size} datasets · ${compactN(rows)} rows` : "No files loaded";
}
document.addEventListener("click", (e) => {
  const g = e.target.closest("[data-go]"); if (g) { if (!g.disabled) go(g.dataset.go); return; }
  const th = e.target.closest("[data-thread]"); if (th) { state.ask.current = th.dataset.thread; return go("analyst"); }
  if (e.target.closest("[data-new-thread]")) { state.ask.current = null; return go("analyst"); }
  const p = e.target.closest("[data-party]"); if (p && p.dataset.party) return openParty(p.dataset.party);
  const t = e.target.closest("[data-table]"); if (t) { Object.assign(state.grid, { table: t.dataset.table, filter: "", sort: null, page: 0 }); return go("data"); }
});
function go(view) {
  if (!state.tables.size) return renderLoader();
  state.view = VIEWS[view] ? view : "home";
  try { history.replaceState(null, "", "#" + (state.view === "party" ? "explorer" : state.view)); } catch {}
  renderNav(); closeDrawer();

  VIEWS[state.view]().catch((e) => { $("#main").innerHTML = `<div class="card pad"><h2>Something went wrong</h2><p class="muted">${esc(e.message || e)}</p></div>`; });
}
function remember(kind, id, label) {
  state.recent = [{ kind, id, label }, ...state.recent.filter((r) => !(r.kind === kind && r.id === id))].slice(0, 5);
}
function openParty(id) { state.party = id; go("party"); }

// ---------- Charts ----------
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }
// Area chart over dates: one series, soft fill, emphasized endpoint, crosshair tooltip.
function areaChart(el, labels, values, { fmt = money, height = 220, name = "Volume" } = {}) {
  const W = 760, H = height, L = 44, R = 14, T = 14, B = 28;
  const max = niceMax(Math.max(1, ...values)), n = values.length;
  const x = (i) => L + (n < 2 ? 0 : (i / (n - 1)) * (W - L - R)), y = (v) => T + (1 - v / max) * (H - T - B);
  const ticks = [0, 0.5, 1].map((f) => f * max);
  const xt = n ? [0, Math.floor((n - 1) / 2), n - 1] : [];
  const line = values.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join("");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(name)} over time">
    <g class="gridl">${ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/>`).join("")}</g>
    <g class="axis">${ticks.map((t) => `<text x="${L - 10}" y="${y(t) + 4}" text-anchor="end">${compactN(t)}</text>`).join("")}
      ${xt.map((i) => `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}">${esc(labels[i])}</text>`).join("")}</g>
    ${n ? `<path d="${line}L${x(n - 1)} ${y(0)}L${x(0)} ${y(0)}Z" fill="var(--accent-fill)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(n - 1)}" cy="${y(values[n - 1])}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>` : ""}
    <line class="xh" y1="${T}" y2="${H - B}" stroke="var(--faint)" stroke-dasharray="3 3" visibility="hidden"/>
    <circle class="hd" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
    <rect class="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  const svg = $("svg", el), tip = $(".tip", el), xh = $(".xh", el), hd = $(".hd", el), hit = $(".hit", el);
  hit.addEventListener("pointermove", (ev) => {
    if (!n) return;
    const r = svg.getBoundingClientRect(), px = ((ev.clientX - r.left) / r.width) * W;
    const i = Math.max(0, Math.min(n - 1, Math.round(((px - L) / (W - L - R)) * (n - 1))));
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("visibility", "visible");
    hd.setAttribute("cx", x(i)); hd.setAttribute("cy", y(values[i])); hd.setAttribute("visibility", "visible");
    tip.innerHTML = `<div class="t">${esc(labels[i])}</div><div class="r"><span>${esc(name)}</span><b>${fmt(values[i])}</b></div>`; tip.hidden = false;
    tip.style.left = Math.min((x(i) / W) * r.width + 12, r.width - tip.offsetWidth) + "px"; tip.style.top = "6px";
  });
  hit.addEventListener("pointerleave", () => { tip.hidden = true; xh.setAttribute("visibility", "hidden"); hd.setAttribute("visibility", "hidden"); });
}
function barList(rows, { fmt = money, party = false } = {}) {
  if (!rows.length) return `<div class="empty">No rows for this period.</div>`;
  const max = Math.max(...rows.map((r) => Math.abs(Number(r.value)) || 0), 1);
  return `<div class="barlist">${rows.map((r) => `<div class="barrow${party && r.id ? " click" : ""}" ${party && r.id ? `data-party="${esc(r.id)}"` : ""}>
    <div class="top"><span class="name">${esc(r.label)}</span><span class="val">${fmt(r.value)}</span></div>
    <div class="track"><div class="fill" style="width:${(Math.abs(Number(r.value)) / max * 100).toFixed(1)}%"></div></div></div>`).join("")}</div>`;
}
function table(rows, cols, { party = null, numeric = [] } = {}) {
  if (!rows.length) return `<div class="empty">No rows.</div>`;
  const isNum = (c) => numeric.includes(c) || rows.every((r) => r[c] === null || typeof r[c] === "number");
  return `<div class="tablewrap"><table><thead><tr>${cols.map((c) => `<th class="${isNum(c[0]) ? "num" : ""}">${esc(c[1])}</th>`).join("")}</tr></thead><tbody>

  </tbody></table></div>`;
}

// Mini type graph: hubs in the middle, every other type on an ellipse around them,
// circle area by record count, a line per reference.
function drawTypeGraph(el, types, refs) {
  const W = 560, H = 300, cx = W / 2, cy = H / 2 - 6;
  const r = d3.scaleSqrt().domain([0, d3.max(types, (d) => d.rows) || 1]).range([6, 22]);
  const hubs = types.filter((d) => typeOf(d.t).role === "hub"), rest = types.filter((d) => typeOf(d.t).role !== "hub");
  const pos = new Map();
  hubs.forEach((d, i) => pos.set(d.t, { x: cx + (i - (hubs.length - 1) / 2) * 120, y: cy }));
  rest.forEach((d, i) => { const a = -Math.PI / 2 + (i + 0.5) * (2 * Math.PI / rest.length); pos.set(d.t, { x: cx + 230 * Math.cos(a), y: cy + 108 * Math.sin(a) }); });
  const label = (d) => { const p = pos.get(d.t), rr = r(d.rows); return `<g style="cursor:pointer" data-table="${esc(d.t)}"><circle cx="${p.x}" cy="${p.y}" r="${rr}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
      <text x="${p.x}" y="${p.y + rr + 14}" text-anchor="middle" style="font-size:12.5px;font-weight:500;fill:var(--fg)">${esc(typeOf(d.t).name)}</text>
      <text x="${p.x}" y="${p.y + rr + 27}" text-anchor="middle" style="font-size:11px;fill:var(--muted)">${compactN(d.rows)}</text></g>`; };
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;overflow:visible" role="img" aria-label="Object types and how they reference each other">
    ${refs.map((l) => { const a = pos.get(l.from), b = pos.get(l.to); return a && b ? `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--line-strong)" stroke-width="1.2" ${l.dashed ? 'stroke-dasharray="4 4"' : ""}/>` : ""; }).join("")}
    ${types.map(label).join("")}</svg>`;
}

// ---------- Explorer: records around their parties ----------
let graphCache = null;
async function buildGraph() {
  if (graphCache) return graphCache;
  const nodes = [], links = [], byId = new Map(), seenLinks = new Set(), PER = 400, TOTAL = 1500;
  const add = (type, key, label, row) => { const id = type + ":" + key; if (byId.has(id)) return byId.get(id); const n = { id, type, key: String(key), label: String(label ?? key), row, deg: 0 }; nodes.push(n); byId.set(id, n); return n; };
  if (!has("parties")) return (graphCache = { nodes, links, byId });
  // Parties ranked by how much hangs off them, so the cap keeps the best-connected records.
  const sat = Object.keys(TYPES).filter((t) => t !== "parties" && has(t) && TYPES[t].key && hasCol(t, TYPES[t].key) && hasCol(t, "party_id") && typeOf(t).role === "record");
  const deg = sat.length ? `(${sat.map((t) => `SELECT party_id FROM ${qid(t)}`).join(" UNION ALL ")})` : "(SELECT NULL AS party_id)";
  const parties = await q(`SELECT p.*, coalesce(d.n, 0) AS n FROM parties p LEFT JOIN (SELECT party_id, count(*) AS n FROM ${deg} GROUP BY 1) d USING (party_id) ORDER BY n DESC LIMIT 300`);
  for (const p of parties) add("parties", p.party_id, p.party_name || p.party_id, p);
  const ids = parties.map((p) => lit(p.party_id)).join(",") || "''";
  for (const t of sat) {
    if (nodes.length >= TOTAL) break;
    const ty = typeOf(t);
    const rows = await q(`SELECT * FROM ${qid(t)} WHERE party_id IN (${ids}) LIMIT ${Math.min(PER, TOTAL - nodes.length)}`);
    for (const r of rows) {
      const n = add(t, r[ty.key], r[ty.label] ?? r[ty.key], r), p = byId.get("parties:" + r.party_id);
      const lk = n.id + ">" + (p && p.id);
      if (p && !seenLinks.has(lk)) { seenLinks.add(lk); links.push({ source: n.id, target: p.id }); n.deg++; p.deg++; }
    }
  }
  return (graphCache = { nodes, links, byId });
}
const endId = (e) => (typeof e === "object" ? e.id : e);
function neighbors(g, id) { return g.links.filter((l) => endId(l.source) === id || endId(l.target) === id).map((l) => g.byId.get(endId(l.source) === id ? endId(l.target) : endId(l.source))).filter(Boolean); }

async function renderExplorer() {
  const s = state.explorer;
  $("#main").innerHTML = `<div class="section-head"><div><h1>Explorer</h1><p class="lede">Your records and how they connect.</p></div>
    <div class="seg" id="mode"><button data-m="graph" aria-pressed="${s.mode === "graph"}">Graph</button><button data-m="table" aria-pressed="${s.mode === "table"}">Table</button></div></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><div class="search" style="flex:1 1 260px;max-width:420px">${icon("search")}<input type="search" id="xq" placeholder="Find a record" value="${esc(s.q)}" aria-label="Find a record"></div><div class="typechips" id="chips"></div></div>

function drawRecordGraph(g) {
  const s = state.explorer, el = $("#xbody");
  el.innerHTML = `<div class="graph-wrap" id="gw"><svg id="gsvg" aria-label="Records and their links"></svg>
    <div class="zoom"><button id="zin" aria-label="Zoom in">${icon("plus")}</button><button id="zout" aria-label="Zoom out">${icon("minus")}</button><button id="zfit" aria-label="Fit to view">${icon("fit")}</button></div><div id="insp"></div></div>`;
  const vis = g.nodes.filter((n) => !s.hidden.has(n.type)), visIds = new Set(vis.map((n) => n.id));
  const links = g.links.map((l) => ({ source: endId(l.source), target: endId(l.target) })).filter((l) => visIds.has(l.source) && visIds.has(l.target));
  const nodes = vis.map((n) => ({ ...n, ref: n }));
  const r = (n) => n.type === "parties" ? Math.max(9, Math.min(18, 6 + Math.sqrt(n.deg) * 1.2)) : 5;
  // Strong short links and a weak repulsion pack each party's records into a rosette around it.
  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id((d) => d.id).distance(10).strength(0.9))
    .force("charge", d3.forceManyBody().strength((d) => d.type === "parties" ? -70 : -5))
    .force("collide", d3.forceCollide((d) => r(d) + 1.6).iterations(2))
    .force("x", d3.forceX(0).strength(0.07)).force("y", d3.forceY(0).strength(0.07)).stop();
  for (let i = 0; i < 260; i++) sim.tick();
  const svg = d3.select("#gsvg"), root = svg.append("g");
  const linkSel = root.append("g").selectAll("line").data(links).join("line").attr("stroke", "var(--line-strong)").attr("stroke-width", 0.6)
    .attr("x1", (d) => d.source.x).attr("y1", (d) => d.source.y).attr("x2", (d) => d.target.x).attr("y2", (d) => d.target.y);
  const nodeSel = root.append("g").selectAll("circle").data(nodes).join("circle").attr("cx", (d) => d.x).attr("cy", (d) => d.y).attr("r", r)
    .attr("fill", (d) => typeColor(d.type)).attr("stroke", "var(--surface)").attr("stroke-width", 1).style("cursor", "pointer");
  nodeSel.append("title").text((d) => `${typeOf(d.type).name}: ${d.label}`);
  const labelG = root.append("g");
  const zoom = d3.zoom().scaleExtent([0.15, 8]).on("zoom", (e) => { root.attr("transform", e.transform); labelG.attr("font-size", 11.5 / e.transform.k).attr("stroke-width", 3 / e.transform.k); });
  svg.call(zoom).on("dblclick.zoom", null);
  const fit = () => {
    const box = $("#gw").getBoundingClientRect(); if (!nodes.length) return;
    const [x0, x1] = d3.extent(nodes, (d) => d.x), [y0, y1] = d3.extent(nodes, (d) => d.y);
    const k = Math.min(4, 0.9 / Math.max((x1 - x0 + 40) / box.width, (y1 - y0 + 40) / box.height));
    svg.call(zoom.transform, d3.zoomIdentity.translate(box.width / 2, box.height / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2));
  };
  fit();
  $("#zin").onclick = () => svg.transition().duration(200).call(zoom.scaleBy, 1.5);
  $("#zout").onclick = () => svg.transition().duration(200).call(zoom.scaleBy, 1 / 1.5);
  $("#zfit").onclick = fit;
  const byId = new Map(nodes.map((n) => [n.id, n]));
  const highlight = (sel) => {
    const nb = sel ? new Set([sel.id, ...neighbors(g, sel.id).map((n) => n.id)]) : null;
    const touches = (d) => sel && (d.source.id === sel.id || d.target.id === sel.id);
    nodeSel.attr("opacity", (d) => !nb || nb.has(d.id) ? 1 : 0.18).attr("stroke", (d) => sel && d.id === sel.id ? "var(--fg)" : "var(--surface)").attr("stroke-width", (d) => sel && d.id === sel.id ? 2 : 1);
    linkSel.attr("opacity", (d) => !sel || touches(d) ? 1 : 0.1).attr("stroke", (d) => touches(d) ? "var(--faint)" : "var(--line-strong)");
    const shown = sel ? [byId.get(sel.id), ...neighbors(g, sel.id).map((n) => byId.get(n.id)).filter(Boolean).slice(0, 12)].filter(Boolean) : [];
    // Each label points away from the selected record, so a rosette's labels fan out instead of piling up.
    const c = sel && byId.get(sel.id), dir = (d) => { if (!c || d.id === c.id) return { x: 0, y: 1 }; const dx = d.x - c.x, dy = d.y - c.y, m = Math.hypot(dx, dy) || 1; return { x: dx / m, y: dy / m }; };
    labelG.selectAll("text").data(shown, (d) => d.id).join("text").attr("class", "lbl")
      .attr("x", (d) => d.x + dir(d).x * (r(d) + 2)).attr("y", (d) => d.y + dir(d).y * (r(d) + 2) + (d.id === c?.id ? 12 : 3))
      .attr("text-anchor", (d) => d.id === c?.id ? "middle" : dir(d).x >= 0 ? "start" : "end")
      .style("font-weight", (d) => d.id === sel?.id ? 600 : 400).text((d) => (d.type === "parties" ? "" : typeOf(d.type).name + " ") + (d.label.length > 28 ? d.label.slice(0, 27) + "…" : d.label));
  };
  const center = (x) => {
    const t = byId.get(x.id); if (!t) return;
    const box = $("#gw").getBoundingClientRect(), k = Math.max(d3.zoomTransform(svg.node()).k, 2.2);
    svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity.translate(box.width * 0.36, box.height / 2).scale(k).translate(-t.x, -t.y));
  };
  const select = (n) => { s.selected = n ? n.id : null; highlight(n); inspector(g, n, select, center); };
  nodeSel.on("click", (e, d) => { e.stopPropagation(); select(d.ref); center(d); });
  nodeSel.on("dblclick", (e, d) => { e.stopPropagation(); select(d.ref); const box = $("#gw").getBoundingClientRect(); svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity.translate(box.width * 0.36, box.height / 2).scale(4).translate(-d.x, -d.y)); });
  svg.on("click", () => select(null));
  const ql = s.q.toLowerCase();
  if (ql) { const hit = nodes.find((n) => n.label.toLowerCase().includes(ql) || n.key.toLowerCase().includes(ql)); if (hit) { select(hit.ref); center(hit); } }
  else if (s.selected && byId.has(s.selected)) select(byId.get(s.selected).ref);
}

async function renderTypes() {
  const refs = references(), t = [...state.tables.keys()];
  const byRole = (role) => t.filter((x) => typeOf(x).role === role);
  const hubs = byRole("hub"), acts = byRole("activity"), recs = byRole("record");
  // Activity streams on top, hubs in the middle, everything that references them below;
  // any row longer than four cards wraps.
  const chunk = (r) => { const out = []; for (let i = 0; i < r.length; i += 4) out.push(r.slice(i, i + 4)); return out; };
  const fill = Math.max(0, 4 - hubs.length);
  const rows = [...chunk(acts), ...chunk([...hubs, ...recs.slice(0, fill)]), ...chunk(recs.slice(fill))];
  const desc = (x) => {
    const ty = typeOf(x), n = state.tables.get(x).rows;
    const linked = refs.filter((r) => r.from === x).map((r) => plural(typeOf(r.to).name.toLowerCase()));
    return `${count(n)} ${plural(ty.name.toLowerCase(), n)} from the export${linked.length ? ", linked to " + linked.join(" and ") : ""}.`;
  };
  $("#main").innerHTML = `<div class="section-head"><div><h1>Ontology</h1><p class="lede">Real-world objects and relationships, grounded in the ledger export.</p></div></div>
    <div class="muted" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="pill" style="padding:5px 8px">${icon("file")}</span>${t.length} tables from 1 source, condensed into <b style="color:var(--fg)">${t.length} entities</b> and ${refs.length} connections</div>
    <div class="canvas" id="canvas"><svg class="links" id="links"></svg><div class="rows">${rows.map((r) => `<div class="row">${r.map((x) => {
      const ty = typeOf(x), info = state.tables.get(x);
      return `<div class="tcard ${ty.role === "activity" ? "activity" : ""}" data-card="${x}" data-table="${x}" tabindex="0">
        <div class="tt">${esc(ty.name)}</div>
        <div class="meta">${count(info.rows)} ${ty.role === "activity" ? "rows" : "records"}${ty.key && hasCol(x, ty.key) ? ` · key <code>${esc(ty.key)}</code>` : ""}</div>
        <div class="desc">${esc(desc(x))}</div>
        ${ty.role === "activity" ? `<span class="tag">Activity stream</span>` : ""}
        <div class="src"><span>${icon("file")}${esc(x)}</span><span>Export</span></div></div>`; }).join("")}</div>`).join("")}</div></div>
    <div class="canvas-foot"><span>Open a type to browse its rows.</span><span class="legend"><span>Link</span><span class="dash">Activity</span></span></div>`;
  drawCanvasLinks(refs);
  window.addEventListener("resize", () => state.view === "types" && drawCanvasLinks(refs), { once: true });
}
function drawCanvasLinks(refs) {
  const cv = $("#canvas"), svg = $("#links"); if (!cv) return;
  cv.querySelectorAll(".elabel").forEach((e) => e.remove());
  const base = cv.getBoundingClientRect();
  const pos = (t) => { const e = cv.querySelector(`[data-card="${t}"]`); if (!e) return null; const r = e.getBoundingClientRect(); return { x: r.left - base.left + cv.scrollLeft, y: r.top - base.top + cv.scrollTop, w: r.width, h: r.height }; };
  svg.setAttribute("width", cv.scrollWidth); svg.setAttribute("height", cv.scrollHeight);
  const fan = new Map(); let paths = "";
  const addLabel = (x, y) => { const lab = document.createElement("div"); lab.className = "elabel"; lab.textContent = "References"; lab.style.left = x + "px"; lab.style.top = y + "px"; cv.append(lab); };
  for (const l of refs) {
    const a = pos(l.from), b = pos(l.to); if (!a || !b) continue;
    const same = Math.abs(a.y - b.y) < 10, down = !same && a.y < b.y;
    // References into one edge of a hub fan out along it and share one label.
    const edge = l.to + (same ? "s" : down ? "t" : "b"), k = fan.get(edge) || 0; fan.set(edge, k + 1);
    const off = (k % 2 ? 1 : -1) * Math.ceil(k / 2) * 22;
    const x1 = a.x + a.w / 2, x2 = b.x + b.w / 2 + off;
    let d, ah, lx, ly;
    if (same) {
      // Cards in one row: leave from the bottom and dip under the row, so no line crosses a card.
      const y1 = a.y + a.h, y2 = b.y + b.h, dip = Math.max(y1, y2) + 34;
      d = `M${x1} ${y1}C${x1} ${dip} ${x2} ${dip} ${x2} ${y2}`; ah = `M${x2 - 4} ${y2 + 7}L${x2} ${y2}L${x2 + 4} ${y2 + 7}`;
      lx = (x1 + x2) / 2; ly = dip - 8;
    } else {
      const y1 = down ? a.y + a.h : a.y, y2 = down ? b.y : b.y + b.h, my = (y1 + y2) / 2;
      d = `M${x1} ${y1}C${x1} ${my} ${x2} ${my} ${x2} ${y2}`; ah = `M${x2 - 4} ${y2 + (down ? -7 : 7)}L${x2} ${y2}L${x2 + 4} ${y2 + (down ? -7 : 7)}`;
      lx = b.x + b.w / 2; ly = y2 + (down ? -26 : 26);
    }
    paths += `<path d="${d}" ${l.dashed ? 'stroke-dasharray="5 5"' : ""}/><path d="${ah}"/>`;
    if (k === 0) addLabel(lx, ly);
  }
  svg.innerHTML = paths;
}

async function drawGrid() {
  const g = state.grid, t = state.tables.get(g.table), PAGE = 100;
  const text = t.cols.filter((c) => /CHAR|TEXT|STRING/i.test(c.type)).map((c) => qid(c.name));
  const where = g.filter && text.length ? `WHERE ${text.map((c) => `${c} ILIKE ${lit("%" + g.filter + "%")}`).join(" OR ")}` : "";
  const total = (await one(`SELECT count(*) AS n FROM ${qid(g.table)} ${where}`)).n;
  const order = g.sort ? `ORDER BY ${qid(g.sort)} ${g.desc ? "DESC" : "ASC"} NULLS LAST` : "";
  const rows = await q(`SELECT * FROM ${qid(g.table)} ${where} ${order} LIMIT ${PAGE} OFFSET ${g.page * PAGE}`);
  const isNum = (c) => /INT|DOUBLE|DECIMAL|FLOAT|REAL|NUMERIC/i.test(c.type);
  $("#grid").innerHTML = `<table><thead><tr>${t.cols.map((c) => `<th class="sortable ${isNum(c) ? "num" : ""}" data-c="${esc(c.name)}">${esc(c.name)}${g.sort === c.name ? (g.desc ? " ↓" : " ↑") : ""}</th>`).join("")}</tr></thead>
    <tbody>${rows.map((r) => `<tr>${t.cols.map((c) => `<td class="${isNum(c) ? "num" : ""}">${c.name === "party_id" && r[c.name] && has("parties") ? `<button class="link" data-party="${esc(r[c.name])}">${esc(r[c.name])}</button>` : cell(r[c.name])}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  $("#grid thead").addEventListener("click", (e) => { const th = e.target.closest("th"); if (!th) return; g.desc = g.sort === th.dataset.c ? !g.desc : false; g.sort = th.dataset.c; drawGrid(); });
  const pages = Math.max(1, Math.ceil(total / PAGE));
  $("#pager").innerHTML = `<span>${count(total)} ${plural("row", total)}${g.filter ? " match" : ""}</span><button class="btn" id="pp" ${g.page ? "" : "disabled"}>Previous</button><span>Page ${g.page + 1} of ${pages}</span><button class="btn" id="pn" ${g.page + 1 < pages ? "" : "disabled"}>Next</button>`;
  $("#pp").onclick = () => { g.page--; drawGrid(); }; $("#pn").onclick = () => { g.page++; drawGrid(); };
}

// ---------- Analyst ----------
const RULES = () => `You answer questions about Ark's dev-environment ledger data for an executive audience, using DuckDB SQL over these tables:

${[...state.tables].map(([n, t]) => `${n} (${t.rows} rows): ${t.cols.map((c) => c.name + " " + c.type).join(", ")}`).join("\n")}

Facts about the data:
- party_id identifies a customer, bank or issuer; parties.party_name is its name. Every table's party_id joins to parties.
- Amounts ending in _usd and the amount and balance columns are decimal US dollars (ArkUSD is a dollar stablecoin). Never add amounts of different assets.
- accounts.account_type is the first segment of the ledger address (clients, banks, platform, ...). Client accounts are credit-normal: a negative settled_balance is money Ark holds for that client.
- daily_volume and revenue are already aggregated per party per day or month.

Use the run_sql tool for every figure; it returns at most 50 rows as JSON. Prefer one well-aggregated query over many. Then answer in a few short sentences or a small list: lead with the answer, give the key figures formatted as dollars, and mention any caveat in the data. Do not show SQL in the answer; the page shows it.`;

function md(text) {
  return esc(text).split(/```/).map((b, i) => i % 2 ? `<pre>${b.replace(/^\w*\n/, "")}</pre>` : b.split(/\n{2,}/).map((para) => {
    const lines = para.split("\n"), inline = (l) => l.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
    if (lines.every((l) => /^\s*([-*]|\d+\.)\s/.test(l))) return `<ul>${lines.map((l) => `<li>${inline(l.replace(/^\s*([-*]|\d+\.)\s/, ""))}</li>`).join("")}</ul>`;
    return `<p>${lines.map(inline).join("<br>")}</p>`;
  }).join("")).join("");
}
const thread = () => state.ask.threads.find((t) => t.id === state.ask.current);
function newThread(text) {
  const t = { id: "t" + Date.now(), title: text.length > 60 ? text.slice(0, 57) + "..." : text, turns: [] };
  state.ask.threads.push(t); state.ask.current = t.id; remember("thread", t.id, t.title);
  return t;
}
function startQuestion(text) { newThread(text); go("analyst"); send(text); }
async function renderAnalyst() {
  const avail = !!state.sample, th = thread();
  $("#main").innerHTML = `<div class="ask">
    <div><h1>Analyst</h1><p class="lede">Claude writes SQL against the loaded files, runs it here in your browser, and answers from the results. Every step is shown.</p></div>
    <div class="thread" id="thread"></div>
    <div class="composer">
      ${avail ? "" : `<div class="card pad"><div class="empty">Claude isn't available in this view. Open this artifact on claude.ai to ask questions.</div></div>`}
      ${th?.turns.length ? "" : `<div class="chips" style="margin:0">${starters().map((x) => `<button class="pill" data-q="${esc(x)}">${esc(x)}</button>`).join("")}</div>`}
      <form class="askbox" id="aform" style="margin:0;max-width:none">${icon("spark", "spark")}<input id="qbox" placeholder="Ask about balances, volume, revenue, customers, owners..." ${avail ? "" : "disabled"} aria-label="Question" autocomplete="off"><button class="send" aria-label="Ask" ${avail ? "" : "disabled"}>${icon("up")}</button></form>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap" class="small muted">
        <label for="tier">Model</label><select id="tier"><option value="quick">Fast</option><option value="default" selected>Balanced</option><option value="complex">Most capable</option></select>
        <button class="btn" id="stop" hidden>Stop</button></div>
    </div></div>`;
  for (const t of th?.turns || []) appendTurn(t);
  document.querySelectorAll("[data-q]").forEach((b) => b.addEventListener("click", () => ask(b.dataset.q)));
  $("#aform").addEventListener("submit", (e) => { e.preventDefault(); const v = $("#qbox").value.trim(); if (v) ask(v); });
  $("#stop").addEventListener("click", () => state.ask.ctl?.abort());
}
function ask(text) {
  if (!thread()) { newThread(text); renderNav(); document.querySelector(".composer .chips")?.remove(); }
  send(text);
}
function appendTurn(t) {
  const th = $("#thread"); if (!th) return null;
  const u = document.createElement("div"); u.className = "msg-user"; u.textContent = t.q; th.append(u);
  const b = document.createElement("div"); b.className = "msg-bot";
  b.innerHTML = `<div class="tools" style="display:grid;gap:8px"></div><div class="answer">${t.a ? md(t.a) : ""}${t.err ? `<p class="muted">${esc(t.err)}</p>` : t.a ? "" : '<p class="thinking">Thinking...</p>'}</div>`;
  th.append(b);
  for (const c of t.calls || []) addCall(b, c);
  return b;
}
function addCall(b, c) {
  const d = document.createElement("details"); d.className = "toolcall";
  const cols = c.rows?.length ? Object.keys(c.rows[0]) : [];
  d.innerHTML = `<summary><span class="pill" style="padding:1px 8px;font-size:11.5px">SQL</span>${c.error ? `failed: ${esc(c.error)}` : `${c.rows.length} ${plural("row", c.rows.length)} in ${c.ms} ms`}</summary>
    <div class="body"><pre>${esc(c.sql)}</pre>${cols.length ? `<div class="grid-scroll" style="max-height:300px">${table(c.rows.slice(0, 20), cols.map((k) => [k, k]))}</div>` : ""}</div>`;
  $(".tools", b).append(d);
}
async function send(question) {
  const s = state.ask, th = thread();
  if (!th || s.busy) return;
  if ($("#qbox")) $("#qbox").value = "";
  const turn = { q: question, a: "", calls: [] }; th.turns.push(turn);
  if (!state.sample) { turn.err = "Claude isn't available in this view. Open this artifact on claude.ai to ask questions."; appendTurn(turn); return; }
  const b = appendTurn(turn); b?.scrollIntoView({ block: "end", behavior: "smooth" });
  s.busy = true; s.ctl = new AbortController(); if ($("#stop")) $("#stop").hidden = false;
  // Earlier turns keep only question and answer; the tables and rules lead every call.
  const history = th.turns.slice(0, -1).filter((t) => t.a).slice(-6).flatMap((t) => [{ role: "user", content: t.q }, { role: "assistant", content: t.a }]);
  const box = () => (state.view === "analyst" && thread() === th ? b : null);
  try {
    await state.sample([{ role: "user", content: RULES() }, ...history, { role: "user", content: question }], {
      signal: s.ctl.signal, modelTier: $("#tier")?.value || "default", cache: false,
      onText: ({ text }) => { turn.a = text; const el = box(); if (el) $(".answer", el).innerHTML = md(text); },
      tools: [{
        name: "run_sql",
        description: "Run one read-only DuckDB SELECT (or WITH ... SELECT) over the loaded tables. Returns up to 50 result rows as JSON.",
        inputSchema: { type: "object", properties: { sql: { type: "string", description: "One SELECT statement" } }, required: ["sql"] },
        async execute(input) {
          const sql = String(input.sql || "").trim().replace(/;\s*$/, ""), call = { sql, rows: [], ms: 0 };
          try {
            if (!/^(select|with)\b/i.test(sql) || /;/.test(sql)) throw new Error("Only a single SELECT statement is allowed");
            const t0 = performance.now(); call.rows = (await q(sql)).slice(0, 50); call.ms = Math.round(performance.now() - t0);
            return call.rows;
          } catch (e) { call.error = e.message || String(e); throw e; }
          finally { turn.calls.push(call); const el = box(); if (el) addCall(el, call); }
        },
      }],
    });
  } catch (e) {
    turn.a = e.text || "";
    turn.err = { not_granted: "Claude wasn't allowed for this page. Allow it from the artifact's permissions to ask questions.", rate_limited: "Too many questions at once or a usage limit was reached. Try again in a little while.", cancelled: "Stopped.", refused: "Claude declined this question. Try rephrasing it." }[e.code] || `Claude couldn't finish: ${e.message || e.code}.`;
    const el = box(); if (el) $(".answer", el).innerHTML = (turn.a ? md(turn.a) : "") + `<p class="muted">${esc(turn.err)}</p>`;
  } finally {
    s.busy = false; s.ctl = null; if ($("#stop")) $("#stop").hidden = true;
  }
}

// ---------- Boot ----------
let engineError = "";
renderLoader();
startEngine().then(() => { const el = $("#loadstatus"); if (el && !el.textContent.startsWith("Could")) el.textContent = "Ready. Choose or drop your files."; })
  .catch((e) => { engineError = "The query engine didn't start: " + (e.message || e); const el = $("#loadstatus"); if (el) el.textContent = engineError; });
if (window.claude?.use) window.claude.use("sample").then((s) => { state.sample = s; if (state.view === "analyst") renderAnalyst(); }).catch(() => {});
</script>
